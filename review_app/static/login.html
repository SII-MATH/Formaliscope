<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>进入审阅 · Formaliscope</title>
  <link rel="stylesheet" href="./login.css">
  <script src="./login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="mark">K</div>
    <p class="eyebrow">KIP126 · REVIEW</p>
    <h1>进入审阅工作台</h1>
    <p id="login-hint" class="hint">首次使用填写姓名即可。已有身份请使用恢复码，继续原来的审阅记录。</p>
    <section id="name-entry" hidden>
      <div class="login-tabs" role="group" aria-label="进入方式"><button id="new-tab" class="quiet" aria-pressed="true">首次使用</button><button id="recover-tab" class="quiet" aria-pressed="false">使用恢复码</button></div>
      <form id="register-form"><label for="display-name">姓名</label><input id="display-name" autocomplete="name" maxlength="60" required placeholder="请输入你的姓名"><button id="register" type="submit">创建我的审阅身份 →</button></form>
      <form id="recover-form" hidden><label for="recovery-code">恢复码</label><input id="recovery-code" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="100" placeholder="KIP-…"><button id="recover" type="submit">恢复我的审阅记录 →</button><p class="hint">管理员也从这里登录。请勿输入姓名或日常密码。</p></form>
    </section>
    <section id="recovery-panel" hidden><h2>保存你的恢复码</h2><p class="hint">同一浏览器会记住你。换设备、退出或清除浏览器数据后，用它找回原来的身份和记录。请私下保存，勿分享给别人。</p><label for="new-recovery-code">你的恢复码（仅此次显示）</label><input id="new-recovery-code" readonly autocomplete="off" spellcheck="false"><div class="login-tabs"><button id="copy-recovery" class="quiet">复制恢复码</button><button id="download-recovery" class="quiet">下载保存</button></div><button id="continue">我已保存，进入审阅 →</button></section>
    <form id="email-form" hidden>
      <label for="email">邮箱地址</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com">
      <button id="send" type="submit">发送验证码</button>
    </form>
    <form id="code-form" hidden>
      <label for="code">8 位验证码</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required
             minlength="8" maxlength="8" pattern="[0-9]{8}" placeholder="请输入邮件中的验证码">
      <button id="verify" type="submit">登录审核台</button>
      <button id="resend" type="button" class="quiet">重新发送验证码</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
