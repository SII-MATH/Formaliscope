<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>进入审阅 · Formaliscope</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./login.css">
  <link rel="stylesheet" href="./auth-notice.css"><script src="./auth-notice.js" defer></script>
  <script src="./login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <div class="mark" aria-hidden="true">F</div>
    <p id="environment-hint" class="hint" hidden>本地环境 · 请使用本地账号</p>
    <p class="eyebrow">FORMALISCOPE · REVIEW</p>
    <h1>进入审阅工作台</h1>
    <p id="login-hint" class="hint">使用账号和密码继续审阅。已有用户请直接登录，首次使用请注册。</p>
    <section id="name-entry" hidden>
      <div class="login-tabs" role="group" aria-label="进入方式"><button id="password-tab" class="quiet" aria-pressed="true">密码登录</button><button id="new-tab" class="quiet" aria-pressed="false">注册账号</button></div>
      <form id="password-form"><label for="account">账号（姓名或 ID）</label><input id="account" autocomplete="username" maxlength="254" required placeholder="请输入注册姓名或账号 ID"><label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" required maxlength="128"><button id="password-login" type="submit">登录审阅工作台 →</button><p class="hint">忘记密码请联系管理员重置。初始密码登录后须修改；账号 ID 可在个人信息或管理后台查看。</p></form>
      <form id="register-form" hidden><label for="display-name">姓名</label><input id="display-name" autocomplete="name" maxlength="60" required placeholder="请输入你的姓名"><label for="register-password">设置密码</label><input id="register-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="8–128 个字符"><button id="register" type="submit">注册账号 →</button></form>

    </section>

    <form id="email-form" hidden>
      <label for="email">邮箱地址</label>
      <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="name@example.com">
      <button id="send" type="submit">发送验证码</button>
    </form>
    <form id="code-form" hidden>
      <label for="code">8 位验证码</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required
             minlength="8" maxlength="8" pattern="[0-9]{8}" placeholder="请输入邮件中的验证码">
      <button id="verify" type="submit">登录审核台</button>
      <button id="resend" type="button" class="quiet">重新发送验证码</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
