<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>修改密码 · Formaliscope</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./login.css">
  <link rel="stylesheet" href="./auth-notice.css"><script src="./auth-notice.js" defer></script>
  <script src="./password.js" defer></script>
</head>
<body><main class="login-card">
  <div class="mark" aria-hidden="true">F</div><p class="eyebrow">FORMALISCOPE · ACCOUNT</p>
  <h1>修改密码</h1><p id="password-hint" class="hint">修改后，其他设备上的登录会退出，当前浏览器继续保留登录。</p>
  <label for="password-account">账号 ID</label><input id="password-account" readonly autocomplete="username">
  <form id="change-password-form">
    <label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" required maxlength="128">
    <label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="8–128 个字符">
    <label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
    <button id="change-password" type="submit">保存新密码</button>
  </form>
  <p id="message" role="status" aria-live="polite"></p>
  <div class="login-tabs"><button id="back" class="quiet">返回审阅</button><button id="password-logout" class="quiet">退出登录</button></div>
</main></body></html>
