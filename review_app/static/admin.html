<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP126 · 管理汇总</title><link rel="stylesheet" href="./statement.css"><script src="./admin.js" defer></script></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">K</span><span><b>KIP126</b><small>Statement 审阅工作台</small></span></a><span class="revision">ADMIN / REVIEW RESULTS</span><div class="top-actions"><a href="./">← 返回独立审阅</a><button id="refresh">刷新</button><button id="export">导出汇总</button></div></header><main class="admin-wrap"><div class="admin-head"><p class="eyebrow">REVIEW OVERVIEW</p><h1>独立评审结果汇总</h1><p>每位审阅者的判断分别保存。这里展示当前内容版本的有效结论，保留同名审阅者的独立身份。</p></div><section class="admin-stats"><div class="stat-tile"><small>参与审阅的人数</small><b id="stat-reviewers">—</b></div><div class="stat-tile"><small>通过</small><b id="stat-aligned">—</b></div><div class="stat-tile"><small>没看懂</small><b id="stat-uncertain">—</b></div><div class="stat-tile"><small>不通过</small><b id="stat-misaligned">—</b></div></section><div class="admin-controls"><input id="search" type="search" placeholder="搜索声明或审阅意见" aria-label="搜索汇总"><select id="reviewer" aria-label="按审阅者筛选"><option value="all">所有审阅者</option></select><select id="verdict" aria-label="按结论筛选"><option value="all">所有结论</option><option value="aligned">通过</option><option value="uncertain">没看懂</option><option value="misaligned">不通过</option></select></div><div id="admin-message" role="status"></div><div class="table-scroll"><table><thead><tr><th>条目与意见</th><th>审阅者</th><th>判断</th><th>保存时间</th></tr></thead><tbody id="results"></tbody></table><div id="admin-empty" class="admin-empty" hidden>还没有符合条件的记录。先在独立审阅入口保存一份判断。</div></div><div class="admin-foot"><span id="summary-note"></span><div><button id="prev-page">←</button> <span id="page-label"></span> <button id="next-page">→</button></div></div></main></body></html>
