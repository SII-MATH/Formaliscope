name: Publish Formaliscope application

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-app-main
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify before publishing
        run: |
          python3 -m unittest discover -s review_app -t . -p 'test_*.py'
          python3 -m unittest discover -s statement_workflow -t . -p 'test_*.py'
          python3 -m py_compile review_app/*.py statement_workflow/*.py deploy/formaliscope_release.py
          for script in review_app/static/*.js; do node --check "$script"; done
          for test in review_app/test_*.cjs; do node "$test"; done
          bash -n deploy/formaliscope-app-pull deploy/formaliscope-snapshot-pull deploy/formaliscope-review-backup

      - name: Check deployment units
        run: |
          sudo install -m 0755 deploy/formaliscope-app-pull deploy/formaliscope-snapshot-pull deploy/formaliscope-review-backup /usr/local/sbin/
          sudo install -m 0755 deploy/formaliscope_release.py /usr/local/sbin/formaliscope-release
          systemd-analyze verify deploy/*.service deploy/*.timer

      - name: Choose the next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/tags?per_page=100" > "$RUNNER_TEMP/tags.json"
          tag="$(python3 deploy/formaliscope_release.py next-tag "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/tags.json" "$GITHUB_SHA")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build immutable application archive
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: python3 deploy/formaliscope_release.py package --commit "$GITHUB_SHA" --version "$VERSION" --output "$RUNNER_TEMP/app-release"

      - name: Publish only after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -Eeuo pipefail
          archive="formaliscope-app-$GITHUB_SHA.tar.gz"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if python3 -c 'import json,sys; raise SystemExit(0 if not json.load(open(sys.argv[1]))["isDraft"] else 1)' "$RUNNER_TEMP/existing-release.json"; then
              echo "$TAG is already published; immutable assets left unchanged."
              exit 0
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
              --notes "Formaliscope $TAG. Built and tested from commit $GITHUB_SHA."
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/app-release/$archive" \
            "$RUNNER_TEMP/app-release/$archive.sha256" \
            "$RUNNER_TEMP/app-release/formaliscope-app-manifest.json" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "Published [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
