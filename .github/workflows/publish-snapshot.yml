name: Publish KIP126 evidence snapshot

on:
  workflow_dispatch:
    inputs:
      kip_ref:
        description: KIP126 branch, tag, or commit to review
        required: true
        default: develop
        type: string
  repository_dispatch:
    types: [kip126-updated]

permissions:
  contents: write

concurrency:
  # Different refs may resolve to the same source SHA and immutable release tag.
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Formaliscope builder
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify immutable snapshot publishing
        run: python3 -m unittest review_app.test_snapshot_releases

      - name: Check out KIP126 source
        uses: actions/checkout@v4
        with:
          repository: SII-MATH/KIP126
          ref: ${{ inputs.kip_ref || github.event.client_payload.ref || 'develop' }}
          token: ${{ secrets.KIP126_READ_TOKEN }}
          path: kip126

      - name: Build clean evidence snapshot
        id: snapshot
        run: |
          set -Eeuo pipefail
          python3 -m review_app build \
            --source "$GITHUB_WORKSPACE/kip126" \
            --output "$RUNNER_TEMP/formaliscope-snapshot/snapshot.json" \
            --statements \
            --require-clean
          cp "$RUNNER_TEMP/formaliscope-snapshot/snapshot.json" snapshot.json
          source_commit="$(git -C kip126 rev-parse HEAD)"
          sha256sum snapshot.json > snapshot.json.sha256
          python3 - "$source_commit" <<'PY'
          import json
          import pathlib
          import sys
          from review_app.build import validate_snapshot

          snapshot = json.loads(pathlib.Path("snapshot.json").read_text(encoding="utf-8"))
          validate_snapshot(snapshot)
          if snapshot.get("review_mode") != "statement" or snapshot.get("source_dirty") is not False:
              raise SystemExit("release requires a clean Statement snapshot")
          if snapshot.get("source_commit") != sys.argv[1]:
              raise SystemExit("snapshot source commit does not match the checked-out source")
          manifest = {
              "schema": "formaliscope-snapshot-release.v1",
              "source_repository": "SII-MATH/KIP126",
              "source_commit": sys.argv[1],
              "snapshot_digest": snapshot["digest"],
              "review_mode": "statement",
              "comparison": snapshot.get("comparison"),
          }
          pathlib.Path("snapshot-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          echo "source_commit=${source_commit}" >> "$GITHUB_OUTPUT"

      - name: Verify or publish immutable snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.snapshot.outputs.source_commit }}
          TAG: snapshot-${{ steps.snapshot.outputs.source_commit }}
        run: |
          set -Eeuo pipefail
          python3 deploy/formaliscope_snapshot_release.py \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            --target "$GITHUB_SHA" --artifacts "$GITHUB_WORKSPACE"
          echo "Verified [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
